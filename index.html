const { useState, useEffect, useRef } = React;

// Icone SVG inline (stile lucide) — nessuna dipendenza esterna
function Svg({ size = 24, color = "currentColor", children, ...rest }) {
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size}
      viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2"
      strokeLinecap="round" strokeLinejoin="round" {...rest}>
      {children}
    </svg>
  );
}
const ShieldAlert = (p) => <Svg {...p}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></Svg>;

const MapPin = (p) => <Svg {...p}><path d="M20 10c0 4.4-5.5 9.5-7.3 11a1 1 0 0 1-1.4 0C9.5 19.5 4 14.4 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></Svg>;

const Download = (p) => <Svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></Svg>;
const WifiOff = (p) => <Svg {...p}><path d="M12 20h.01"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><line x1="2" x2="22" y1="2" y2="22"/></Svg>;
const ArrowLeft = (p) => <Svg {...p}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></Svg>;
const FileText = (p) => <Svg {...p}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></Svg>;
// ─────────────────────────────────────────────────────────────

const BRAND = "#1D9E75";
const BRAND_DARK = "#157a5a";
const INK = "#0f1c17";

const CATEGORIES = [
  {
    id: "sicurezza",
    label: "Sicurezza",
    desc: "Near miss, pericolo, condizione non sicura",
    icon: ShieldAlert,
    tint: "#e8f5ef",
    accent: "#1D9E75",
    office: "RSPP / Sicurezza",
    types: [
      "Near miss (mancato infortunio)",
      "Condizione pericolosa (ambiente)",
      "Comportamento pericoloso",
      "DPI mancante o danneggiato",
      "Sversamento / perdita gas",
      "Altro rischio sicurezza",
    ],
  },
  {
    id: "logistica",
    label: "Guasto / Logistica",
    desc: "Mezzi, attrezzature, consegne, bombole",
    icon: Wrench,
    tint: "#fdf1e7",
    accent: "#d9782d",
    office: "Ufficio Logistica / Tecnico",
    types: [
      "Guasto mezzo / attrezzatura",
      "Problema consegna / ritiro",
      "Bombole (giacenza, danni, scambio)",
      "Manutenzione necessaria",
      "Materiale mancante",
      "Altro logistica",
    ],
  },
];

const URGENCY = [
  { id: "bassa", label: "Bassa", hint: "Da valutare, non urgente", color: "#5b8def" },
  { id: "media", label: "Media", hint: "Da gestire a breve", color: "#e0a800" },
  { id: "alta", label: "Alta", hint: "Intervento rapido", color: "#e0533d" },
];

const STEPS = ["Categoria", "Dettagli", "Foto e luogo", "Chi segnala", "Invio"];

function fmtDate(d) {
  return new Intl.DateTimeFormat("it-IT", {
    day: "2-digit", month: "2-digit", year: "numeric",
    hour: "2-digit", minute: "2-digit",
  }).format(d);
}

function newProtocol() {
  const now = new Date();
  const y = now.getFullYear();
  const seq = Math.floor(1000 + Math.random() * 8999);
  return `SG-${y}-${seq}`;
}

// carica jsPDF da CDN una sola volta
let jsPdfPromise = null;
function loadJsPDF() {
  if (window.jspdf?.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (!jsPdfPromise) {
    jsPdfPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      s.onload = () => resolve(window.jspdf.jsPDF);
      s.onerror = () => reject(new Error("Impossibile caricare il generatore PDF"));
      document.head.appendChild(s);
    });
  }
  return jsPdfPromise;
}

// costruisce il PDF della segnalazione e ritorna un Blob
async function buildPdf(data, protocol) {
  const jsPDF = await loadJsPDF();
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210;
  const M = 16;
  const cat = CATEGORIES.find((c) => c.id === data.category);
  const urg = URGENCY.find((u) => u.id === data.urgency);
  const green = [29, 158, 117];
  const ink = [15, 28, 23];
  const grey = [120, 130, 125];

  // intestazione
  doc.setFillColor(...green);
  doc.rect(0, 0, W, 30, "F");
  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(17);
  doc.text("Breathing Safety", M, 15);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.text("Segnalazione dal campo", M, 22);
  doc.setFontSize(13);
  doc.setFont("helvetica", "bold");
  doc.text(protocol, W - M, 15, { align: "right" });
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.text(fmtDate(new Date()), W - M, 21, { align: "right" });

  let y = 42;

  // riga categoria / urgenza
  doc.setFontSize(11);
  doc.setTextColor(...ink);
  doc.setFont("helvetica", "bold");
  doc.text(`${cat?.label || "-"}`, M, y);
  doc.setTextColor(...grey);
  doc.setFont("helvetica", "normal");
  doc.text(`Instradamento: ${cat?.office || "-"}`, M, y + 6);
  doc.setFont("helvetica", "bold");
  const uc = urg?.id === "alta" ? [224, 83, 61] : urg?.id === "media" ? [200, 150, 0] : [91, 141, 239];
  doc.setTextColor(...uc);
  doc.text(`Urgenza: ${urg?.label || "-"}`, W - M, y, { align: "right" });
  y += 14;

  // funzione riga chiave/valore con wrapping
  const field = (label, value) => {
    doc.setDrawColor(235, 239, 237);
    doc.line(M, y - 4, W - M, y - 4);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    doc.setTextColor(...grey);
    doc.text(label.toUpperCase(), M, y);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    doc.setTextColor(...ink);
    const lines = doc.splitTextToSize(value || "—", W - 2 * M);
    doc.text(lines, M, y + 6);
    y += 6 + lines.length * 5.5 + 5;
  };

  field("Tipo", data.type);
  field("Descrizione", data.description);
  field("Sito / cantiere", data.site);
  field("Posizione GPS", data.location ? `${data.location.lat}, ${data.location.lng}` : null);
  field("Segnalante", `${data.reporterName}  ·  ${data.reporterCompany}${data.reporterPhone ? "  ·  " + data.reporterPhone : ""}`);

  // foto
  if (data.photo?.dataUrl) {
    doc.setDrawColor(235, 239, 237);
    doc.line(M, y - 4, W - M, y - 4);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    doc.setTextColor(...grey);
    doc.text("FOTO", M, y);
    y += 4;
    try {
      const dims = imgFit(data.photo.w, data.photo.h, W - 2 * M, 90);
      if (y + dims.h > 285) { doc.addPage(); y = 20; }
      doc.addImage(data.photo.dataUrl, "JPEG", M, y, dims.w, dims.h);
      y += dims.h + 6;
    } catch (e) { /* foto non incorporabile, si prosegue */ }
  }

  // piè di pagina
  doc.setFontSize(8);
  doc.setTextColor(...grey);
  doc.text(
    "Documento generato dall'app segnalazioni. Dati trattati ai sensi del Reg. UE 2016/679.",
    M, 290
  );

  return doc.output("blob");
}

function imgFit(w, h, maxW, maxH) {
  if (!w || !h) return { w: maxW, h: maxH };
  const r = Math.min(maxW / w, maxH / h);
  return { w: w * r, h: h * r };
}

function App() {
  const [online, setOnline] = useState(true);
  const [screen, setScreen] = useState("intro"); // intro | form | done
  const [result, setResult] = useState(null); // { protocol, blob, filename }
  const [busy, setBusy] = useState(false);
  const [pdfError, setPdfError] = useState(null);

  // stato del form
  const [step, setStep] = useState(0);
  const [data, setData] = useState({
    category: null,
    type: "",
    urgency: "media",
    description: "",
    photo: null,
    location: null,
    site: "",
    reporterName: "",
    reporterCompany: "",
    reporterPhone: "",
  });

  const set = (k, v) => setData((d) => ({ ...d, [k]: v }));

  useEffect(() => {
    const on = () => setOnline(true);
    const off = () => setOnline(false);
    window.addEventListener("online", on);
    window.addEventListener("offline", off);
    setOnline(navigator.onLine);
    return () => {
      window.removeEventListener("online", on);
      window.removeEventListener("offline", off);
    };
  }, []);

  const resetForm = () => {
    setStep(0);
    setData({
      category: null, type: "", urgency: "media", description: "",
      photo: null, location: null, site: "",
      reporterName: "", reporterCompany: "", reporterPhone: "",
    });
  };

  // genera il PDF della segnalazione sul dispositivo
  const generate = async () => {
    setBusy(true);
    setPdfError(null);
    try {
      const protocol = newProtocol();
      const blob = await buildPdf(data, protocol);
      const filename = `Segnalazione_${protocol}.pdf`;
      setResult({ protocol, blob, filename });
      setScreen("done");
    } catch (e) {
      setPdfError(e.message || "Errore nella generazione del PDF");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={styles.viewport}>
      <style>{globalCss}</style>

      {!online && (
        <div style={styles.offlineBar}>
          <WifiOff size={15} />
          <span>Offline — la segnalazione verrà inviata al ritorno della rete</span>
        </div>
      )}

      <header style={styles.header}>
        <div style={styles.brandRow}>
          <div>
            <div style={styles.brandName}>Breathing Safety</div>
            <div style={styles.brandSub}>Gruppo CER</div>
          </div>
        </div>
        {screen === "form" && (
          <button
            style={styles.iconBtn}
            onClick={() => { resetForm(); setScreen("intro"); }}
            aria-label="Chiudi"
          >
            <X size={20} />
          </button>
        )}
      </header>

      <main style={styles.main}>
        {screen === "intro" && (
          <Intro onStart={() => { resetForm(); setScreen("form"); }} />
        )}
        {screen === "form" && (
          <Wizard
            step={step} setStep={setStep}
            data={data} set={set}
            onSubmit={generate}
            busy={busy}
            pdfError={pdfError}
          />
        )}
        {screen === "done" && (
          <Done
            result={result}
            data={data}
            onNew={() => { resetForm(); setScreen("form"); }}
            onHome={() => setScreen("intro")}
          />
        )}
      </main>
    </div>
  );
}

// ─────────────────────────────────────────── Intro

function Intro({ onStart }) {
  return (
    <div className="fade">
      <div style={styles.introHero}>
        <h1 style={styles.introTitle}>
          Modulo di segnalazione anomalie
        </h1>

          Compila il modulo guidato e invia la tua segnalazione agli uffici
          che possono intervenire, con foto e posizione.
        </p>
        <button style={styles.cta} onClick={onStart}>
          Nuova segnalazione <ChevronRight size={20} />
        </button>
      </div>

      <div style={styles.introCards}>
        {CATEGORIES.map((c) => {
          const Icon = c.icon;
          return (
            <div key={c.id} style={{ ...styles.introCard, background: c.tint }}>

              <div style={styles.introCardLabel}>{c.label}</div>
              <div style={styles.introCardDesc}>{c.desc}</div>
            </div>
          );
        })}
      </div>

      <div style={styles.privacyNote}>
        I dati raccolti sono trattati dal titolare per la sola gestione delle
        segnalazioni di sicurezza e logistica, ai sensi del Reg. UE 2016/679.
        Non usare l'app per emergenze: in caso di pericolo immediato contatta i
        soccorsi e il preposto.
      </div>

    </div>

}

// ─────────────────────────────────────────── Wizard

function Wizard({ step, setStep, data, set, onSubmit, busy, pdfError }) {
  const cat = CATEGORIES.find((c) => c.id === data.category);

  const canNext = () => {
    if (step === 0) return !!data.category;
    if (step === 1) return data.type && data.description.trim().length >= 5;
    if (step === 2) return true; // foto/luogo opzionali
    if (step === 3) return data.reporterName.trim() && data.reporterCompany.trim();
    return true;
  };

  const next = () => setStep((s) => Math.min(s + 1, STEPS.length - 1));
  const back = () => setStep((s) => Math.max(s - 1, 0));

  return (
    <div className="fade">
      <Progress step={step} />

      <div style={styles.stepArea}>
        {step === 0 && <StepCategory data={data} set={set} />}
        {step === 1 && <StepDetails data={data} set={set} cat={cat} />}
        {step === 2 && <StepPhotoLocation data={data} set={set} />}
        {step === 3 && <StepReporter data={data} set={set} />}
        {step === 4 && <StepReview data={data} cat={cat} />}
      </div>

      <div style={styles.navBar}>
        {step > 0 ? (
          <button style={styles.ghostBtn} onClick={back}>
            <ChevronLeft size={18} /> Indietro
          </button>
        ) : <span />}

        {step < STEPS.length - 1 ? (
          <button
            style={{ ...styles.cta, opacity: canNext() ? 1 : 0.45, pointerEvents: canNext() ? "auto" : "none" }}
            onClick={next}
          >
            Avanti <ChevronRight size={20} />
          </button>
        ) : (
          <button
            style={{ ...styles.cta, opacity: busy ? 0.6 : 1, pointerEvents: busy ? "none" : "auto" }}
            onClick={onSubmit}
          >
            {busy ? "Genero il PDF…" : <>Genera PDF <FileText size={18} /></>}
          </button>
        )}
      </div>
      {pdfError && <div style={styles.errorBox}>{pdfError}</div>}
    </div>
  );
}

function Progress({ step }) {
  return (
    <div style={styles.progressWrap}>
      <div style={styles.progressLabels}>
        <span style={styles.progressStepName}>{STEPS[step]}</span>
        <span style={styles.progressCount}>Passo {step + 1} di {STEPS.length}</span>
      </div>
      <div style={styles.progressTrack}>
        <div style={{ ...styles.progressFill, width: `${((step + 1) / STEPS.length) * 100}%` }} />
      </div>
    </div>
  );
}

// ── Step 0: categoria
function StepCategory({ data, set }) {
  return (
    <div>
      <h2 style={styles.stepTitle}>Di cosa si tratta?</h2>
      <p style={styles.stepHint}>Scegli l'ambito della segnalazione.</p>
      <div style={styles.catGrid}>
        {CATEGORIES.map((c) => {
          const Icon = c.icon;
          const active = data.category === c.id;
          return (
            <button
              key={c.id}
              onClick={() => { set("category", c.id); set("type", ""); }}
              style={{
                ...styles.catCard,
                borderColor: active ? c.accent : "#e4e9e6",
                background: active ? c.tint : "#fff",
                boxShadow: active ? `0 0 0 3px ${c.accent}22` : "none",
              }}
            >
              <div style={{ ...styles.catIconWrap, background: c.tint }}>
                <Icon size={24} color={c.accent} />
              </div>
              <div style={styles.catLabel}>{c.label}</div>
              <div style={styles.catDesc}>{c.desc}</div>
              <div style={{ ...styles.catRoute, color: c.accent }}>→ {c.office}</div>
            </button>
          );
        })}
      </div>
    </div>

}

// ── Step 1: dettagli
function StepDetails({ data, set, cat }) {
  if (!cat) return null;
  return (
    <div>
      <h2 style={styles.stepTitle}>Dettagli</h2>
      <p style={styles.stepHint}>Descrivi il problema in modo chiaro.</p>

      <label style={styles.fieldLabel}>Tipo</label>
      <div style={styles.chipWrap}>
        {cat.types.map((t) => (
          <button
            key={t}
            onClick={() => set("type", t)}
            style={{
              ...styles.chip,
              borderColor: data.type === t ? cat.accent : "#dce3e0",
              background: data.type === t ? cat.tint : "#fff",
              color: data.type === t ? cat.accent : "#3a463f",
              fontWeight: data.type === t ? 600 : 500,
            }}
          >
            {t}
          </button>
        ))}
      </div>

      <label style={styles.fieldLabel}>Descrizione</label>
      <textarea
        style={styles.textarea}
        rows={4}
        placeholder="Cosa hai visto? Dove? Quando? (es. bombola O2 con valvola danneggiata nel deposito di…)"
        value={data.description}
        onChange={(e) => set("description", e.target.value)}
      />

      <label style={styles.fieldLabel}>Urgenza</label>
      <div style={styles.urgencyRow}>
        {URGENCY.map((u) => {
          const active = data.urgency === u.id;
          return (
            <button
              key={u.id}
              onClick={() => set("urgency", u.id)}
              style={{
                ...styles.urgencyBtn,
                borderColor: active ? u.color : "#dce3e0",
                background: active ? `${u.color}14` : "#fff",
              }}
            >
              <span style={{ ...styles.urgencyDot, background: u.color }} />
              <span style={{ ...styles.urgencyLabel, color: active ? u.color : "#3a463f" }}>{u.label}</span>
              <span style={styles.urgencyHint}>{u.hint}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── Step 2: foto e luogo
function StepPhotoLocation({ data, set }) {
  const fileRef = useRef(null);
  const [locating, setLocating] = useState(false);

  const onFile = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const img = new Image();
      img.onload = () => {
        set("photo", { name: f.name, url: dataUrl, dataUrl, w: img.width, h: img.height });
      };
      img.src = dataUrl;
    };
    reader.readAsDataURL(f);
  };

  const getLocation = () => {
    setLocating(true);
    if (!navigator.geolocation) { setLocating(false); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        set("location", {
          lat: pos.coords.latitude.toFixed(5),
          lng: pos.coords.longitude.toFixed(5),
        });
        setLocating(false);
      },
      () => setLocating(false),
      { enableHighAccuracy: true, timeout: 8000 }
    );
  };

  return (
    <div>
      <h2 style={styles.stepTitle}>Foto e luogo</h2>
      <p style={styles.stepHint}>Facoltativi, ma aiutano molto chi interviene.</p>

      <label style={styles.fieldLabel}>Foto</label>
      {data.photo ? (
        <div style={styles.photoPreview}>
          <img src={data.photo.url} alt="Anteprima" style={styles.photoImg} />

// ─────────────────────────────────────────── Done

function Done({ result, data, onNew, onHome }) {
  const [shared, setShared] = useState(false);
  const [note, setNote] = useState(null);
  if (!result) return null;

  const file = new File([result.blob], result.filename, { type: "application/pdf" });
  const cat = CATEGORIES.find((c) => c.id === data.category);
  const canShareFile = typeof navigator !== "undefined" &&
    navigator.canShare && navigator.canShare({ files: [file] });

  const share = async () => {
    try {
      await navigator.share({
        files: [file],
        title: `Segnalazione ${result.protocol}`,
        text: `Segnalazione ${result.protocol} — ${cat?.label || ""}. Inoltra a ${cat?.office || "ufficio competente"}.`,
      });
      setShared(true);
    } catch (e) {
      if (e?.name !== "AbortError") setNote("Condivisione annullata o non disponibile. Usa Scarica PDF.");
    }
  };

  const download = () => {
    const url = URL.createObjectURL(result.blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = result.filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setShared(true);
  };

  return (
    <div className="fade" style={styles.doneWrap}>
      <div style={styles.doneCircle}>
        <Check size={40} color="#fff" strokeWidth={3} />
      </div>
      <h2 style={styles.doneTitle}>PDF pronto</h2>
      <p style={styles.doneLead}>
        La segnalazione è stata trasformata in un documento. Condividila via
        WhatsApp con {cat ? <strong>{cat.office}</strong> : "l'ufficio competente"}, oppure salvala.
      </p>

      <div style={styles.protoBox}>
        <span style={styles.protoLabel}>Numero protocollo</span>
        <span style={styles.protoNum}>{result.protocol}</span>
        <span style={styles.protoDate}>{fmtDate(new Date())}</span>
      </div>

      {canShareFile ? (
        <button style={{ ...styles.cta, ...styles.waBtn }} onClick={share}>
          <Share2 size={19} /> Condividi su WhatsApp
        </button>
      ) : (
        <div style={styles.desktopHint}>
          Su questo dispositivo la condivisione diretta non è disponibile.
          Scarica il PDF e allegalo manualmente a WhatsApp.
        </div>
      )}

      <button style={styles.ghostBtnDownload} onClick={download}>
        <Download size={17} /> Scarica PDF
      </button>

      {note && <div style={styles.errorBox}>{note}</div>}

      {shared && (
        <div style={styles.sharedOk}>
          <Check size={14} /> Ricordati di completare l'invio in WhatsApp.
        </div>
      )}

      <div style={styles.doneDivider} />
      <button style={styles.cta} onClick={onNew}>Nuova segnalazione</button>
      <button style={styles.ghostBtnWide} onClick={onHome}>
        <ArrowLeft size={16} /> Torna alla home
      </button>
    </div>
  );
}
